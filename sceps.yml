name: sceps
channels:
  - conda-forge
dependencies:
  - python=3.9
  # core numerics / data frames
  - numpy=1.26.2
  - pandas=1.5.3
  - scipy=1.13.1
  # single-cell data structures and I/O
  - anndata=0.10.7
  - scanpy=1.10.3
  # neighborhood clustering and sparse matrix utilities
  - scikit-learn=1.3.2
  # regression and multiple-testing / meta-analysis routines
  - statsmodels=0.14.5
  # progress bars and version parsing
  - tqdm=4.67.1
  - packaging=25.0
  # imported by src/estimation.py (also pulled in by scanpy)
  - matplotlib-base=3.9.4
  - seaborn=0.13.2
