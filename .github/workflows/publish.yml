name: Publish to PyPI

# Publishes on GitHub release. Run the workflow manually (workflow_dispatch) to
# push to TestPyPI first and confirm the upload looks right, since a version
# number can never be reused on PyPI once it has been published.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*

      # A release tag whose commit carries a different version silently produces
      # an artifact that does not match the tag, which is easy to miss and
      # impossible to correct once uploaded. Fail here instead.
      - name: Check the tag matches the built version
        if: github.event_name == 'release'
        run: |
          built=$(ls dist/*.tar.gz | sed -E 's/.*sceps-(.+)\.tar\.gz/\1/')
          tag=${GITHUB_REF_NAME#v}
          echo "tag=$tag built=$built"
          if [ "$tag" != "$built" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match built version $built."
            echo "::error::Re-tag the commit whose pyproject.toml declares $tag."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Smoke-test the built wheel: install it and check the console scripts exist.
  verify:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Install wheel and check entry points
        run: |
          python -m pip install dist/*.whl
          python -c "import sceps; print(sceps.__version__)"
          sceps --help > /dev/null
          sceps-cluster-neighborhood --help > /dev/null
          sceps-aggregate --help > /dev/null
          sceps-corr --help > /dev/null

  testpypi:
    needs: verify
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write # required for Trusted Publishing; no API token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # Re-running a release whose files are already uploaded is a no-op
          # rather than an error; PyPI filenames can never be reused.
          skip-existing: true

  pypi:
    needs: verify
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for Trusted Publishing; no API token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Re-running a release whose files are already uploaded is a no-op
          # rather than an error; PyPI filenames can never be reused. The
          # version/tag check in the build job is what catches a genuinely
          # wrong version, so this does not mask that mistake.
          skip-existing: true
